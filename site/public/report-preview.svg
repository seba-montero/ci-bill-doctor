<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CI Bill Doctor pull-request cost signal</title>
  <desc id="desc">A workflow change moves from 0.012 dollars per minute to 0.372 dollars per minute and introduces macOS runner and matrix expansion findings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07110e"/>
      <stop offset="1" stop-color="#10251d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 40) rotate(135) scale(500)">
      <stop stop-color="#96f14f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#96f14f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="28" fill="url(#glow)"/>
  <g opacity=".07" stroke="#d7eee0">
    <path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200"/>
    <path d="M80 0v630M160 0v630M240 0v630M320 0v630M400 0v630M480 0v630M560 0v630M640 0v630M720 0v630M800 0v630M880 0v630M960 0v630M1040 0v630M1120 0v630"/>
  </g>

  <g transform="translate(70 65)">
    <rect width="38" height="38" rx="10" fill="#142b22" stroke="#96f14f" stroke-opacity=".45"/>
    <rect x="9" y="21" width="5" height="9" rx="1" fill="#96f14f"/>
    <rect x="17" y="14" width="5" height="16" rx="1" fill="#96f14f"/>
    <rect x="25" y="8" width="5" height="22" rx="1" fill="#96f14f"/>
    <text x="52" y="27" fill="#edf7f0" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">CI Bill Doctor</text>
  </g>

  <g transform="translate(70 144)">
    <text fill="#96f14f" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">CATCH CI COST REGRESSIONS</text>
    <text y="56" fill="#edf7f0" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="760" letter-spacing="-2">Before they reach the bill.</text>
    <text y="92" fill="#9db3a6" font-family="Inter,Arial,sans-serif" font-size="18">Explainable GitHub Actions cost signals, directly in pull requests.</text>
  </g>

  <g transform="translate(70 282)" filter="url(#shadow)">
    <rect width="1060" height="280" rx="18" fill="#091612" stroke="#d7eee0" stroke-opacity=".2"/>
    <path d="M0 48h1060" stroke="#d7eee0" stroke-opacity=".13"/>
    <circle cx="22" cy="24" r="4" fill="#355246"/><circle cx="35" cy="24" r="4" fill="#355246"/><circle cx="48" cy="24" r="4" fill="#355246"/>
    <text x="530" y="29" text-anchor="middle" fill="#789183" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">workflow cost review</text>
    <text x="1010" y="29" text-anchor="end" fill="#96f14f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="800">ANALYZED</text>

    <g transform="translate(24 70)">
      <text fill="#728a7c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">PULL-REQUEST COST SIGNAL</text>
      <g transform="translate(0 18)">
        <rect width="495" height="72" rx="10" fill="#0d1d17" stroke="#d7eee0" stroke-opacity=".13"/>
        <path d="M165 0v72M330 0v72" stroke="#d7eee0" stroke-opacity=".13"/>
        <text x="16" y="21" fill="#728a7c" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800">BASE</text>
        <text x="16" y="50" fill="#edf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="750">$0.012/min</text>
        <text x="181" y="21" fill="#728a7c" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800">HEAD</text>
        <text x="181" y="50" fill="#edf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="750">$0.372/min</text>
        <rect x="330" width="165" height="72" rx="10" fill="#ff776f" fill-opacity=".055"/>
        <text x="346" y="21" fill="#728a7c" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800">DELTA</text>
        <text x="346" y="50" fill="#ff918a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="750">+$0.360</text>
      </g>

      <g transform="translate(520 18)">
        <rect width="492" height="72" rx="10" fill="#0d1d17" stroke="#d7eee0" stroke-opacity=".13"/>
        <rect x="14" y="15" width="27" height="27" rx="7" fill="#ff776f" fill-opacity=".16"/>
        <text x="27.5" y="34" text-anchor="middle" fill="#ff776f" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">!</text>
        <text x="54" y="29" fill="#edf7f0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">macOS runner has a high per-minute rate</text>
        <text x="54" y="48" fill="#7f9789" font-family="Inter,Arial,sans-serif" font-size="11">Keep macOS only for steps that require Apple tooling.</text>
        <text x="464" y="29" text-anchor="end" fill="#ff918a" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800">HIGH</text>
      </g>

      <g transform="translate(0 106)">
        <rect width="1012" height="72" rx="10" fill="#0d1d17" stroke="#d7eee0" stroke-opacity=".13"/>
        <rect x="14" y="15" width="27" height="27" rx="7" fill="#ffb45f" fill-opacity=".15"/>
        <text x="27.5" y="33" text-anchor="middle" fill="#ffb45f" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800">6×</text>
        <text x="54" y="29" fill="#edf7f0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Matrix expands to many job copies</text>
        <text x="54" y="49" fill="#7f9789" font-family="Inter,Arial,sans-serif" font-size="11">Static matrix fan-out grew from 2 to 6 copies.</text>
        <text x="984" y="29" text-anchor="end" fill="#ffca8f" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800">MEDIUM</text>
      </g>
    </g>
  </g>
  <text x="1130" y="603" text-anchor="end" fill="#728a7c" font-family="Inter,Arial,sans-serif" font-size="12">Free · local-first · open source</text>
</svg>
