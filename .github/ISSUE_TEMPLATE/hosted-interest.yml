name: Hosted capability preference
description: Choose the recurring capability that would be most valuable. No email or meeting required.
title: "[hosted interest]: "
labels:
  - product-signal
body:
  - type: markdown
    attributes:
      value: |
        This form tests product demand; it is not a promise of availability.

        Your response is public. **Do not include an email address, private repository name, workflow YAML, billing information, tokens, logs, or confidential data.**
  - type: dropdown
    id: capability
    attributes:
      label: Which capability would be most valuable?
      options:
        - Persistent repository history and regressions
        - Budget or policy guardrails
        - Multi-repository cost and savings report
        - None of these
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often would this solve a real job?
      options:
        - Several times per week
        - Several times per month
        - Monthly
        - A few times per year
        - One-time audit
    validations:
      required: true
  - type: dropdown
    id: repositories
    attributes:
      label: Approximate number of active repositories
      options:
        - 1
        - 2–5
        - 6–25
        - 26–100
        - More than 100
    validations:
      required: true
  - type: dropdown
    id: price
    attributes:
      label: Would US$19/month for up to five repositories be reasonable if this worked reliably?
      options:
        - Yes
        - Maybe; value must be demonstrated first
        - No; too expensive
        - No; the problem is not recurring
        - Prefer not to answer
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would make it worth keeping?
      description: Describe the decision or recurring job, without private customer or repository details.
      placeholder: I would keep it if it helped us…
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public response confirmation
      options:
        - label: I understand this issue is public and contains no contact, repository, workflow, billing, or confidential data.
          required: true
