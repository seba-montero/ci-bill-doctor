name: Usage question
description: Ask a setup or methodology question without sharing private data.
title: "[question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Questions and answers are public. **Never paste tokens, secrets, private workflow YAML, logs, artifacts, API payloads, billing information, or private repository names.** Use a minimal synthetic example if needed.
  - type: dropdown
    id: surface
    attributes:
      label: What are you using?
      options:
        - Browser scanner
        - GitHub Action
        - CLI
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Keep the question sanitized and focused on setup, output interpretation, or methodology.
      placeholder: How should I…
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This question contains no secrets, private names, logs, billing details, or confidential workflow content.
          required: true
